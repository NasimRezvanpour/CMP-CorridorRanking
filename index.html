<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corridor Ranking | Congestion Management Process</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet-vector@4.2.5/dist/esri-leaflet-vector.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1a1d24; --ink-soft:#444b59; --ink-faint:#5f6775;
  --paper:#f6f7f9; --card:#ffffff; --line:#e1e4ea; --line-soft:#eceef2;
  --arc:#0b2238;
  --shadow:0 1px 2px rgba(26,29,36,.04),0 8px 24px -12px rgba(26,29,36,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.wrap.main{padding-bottom:80px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- HEADER ---------- */
header{padding:44px 0 28px}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:400;color:var(--ink-soft)}
.lede{margin-top:16px;max-width:70ch;color:var(--ink-soft);font-size:15.5px}
.kpis{display:flex;flex-wrap:wrap;margin-top:26px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.kpi{flex:1;min-width:140px;padding:16px 22px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .v{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.1}
.kpi .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;font-family:'Archivo Narrow',sans-serif;font-weight:600}

/* ---------- STICKY CRITERIA TABS ---------- */
.controls{position:sticky;top:0;z-index:1000;background:rgba(246,247,249,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.tabs{display:flex;gap:6px}
.tabs a{flex:1;text-align:center;text-decoration:none;font-family:'Archivo',sans-serif;font-weight:600;font-size:14px;line-height:1.2;
  padding:11px 8px 12px;border-radius:6px;background:#fff;color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--c);
  transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;min-height:48px}
.tabs a:hover{background:#f1f3f6}
.tabs a:focus-visible{outline:3px solid #1d5f8a;outline-offset:2px}
.tabs a.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* ---------- PER-SECTION FILTER BAR ---------- */
.sbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-soft);background:#fafbfc}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;font-family:'Archivo Narrow',sans-serif}
select{font-family:'Archivo',sans-serif;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;outline:none;min-width:170px}
select:focus{border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{font-family:'Space Mono',monospace;font-size:12px;border:none;background:none;padding:7px 13px;cursor:pointer;color:var(--ink-faint);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.reset{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;border:none;background:none;color:var(--ink-faint);cursor:pointer;text-decoration:underline}
.scount{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-faint)}

/* ---------- SECTION ---------- */
section{margin-top:52px;scroll-margin-top:84px}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.snum{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-faint)}
.shead h2{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-.01em}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.sdesc{color:var(--ink-soft);font-size:14px;max-width:80ch;margin-bottom:18px}
.sdesc b{color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.accent{height:5px}
.mgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr)}
.mapcol{position:relative;border-right:1px solid var(--line-soft);min-height:580px}
.map{position:absolute;inset:0;background:#e9e6de}
.mapnote{position:absolute;top:10px;left:56px;z-index:500;font-family:'Space Mono',monospace;font-size:10px;background:rgba(255,255,255,.92);
  border:1px dashed #b45309;color:#92400e;padding:4px 8px;border-radius:6px}
.maphint{position:absolute;bottom:8px;left:10px;z-index:500;font-size:10.5px;color:var(--ink-faint);background:rgba(255,255,255,.88);padding:2px 7px;border-radius:5px}
.mlegend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-soft)}
.mlegend .sw{display:inline-flex;align-items:center;gap:6px}
.mlegend .ln{display:inline-block;width:22px;border-radius:2px}
.mlegend .pin{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;color:#fff;font:700 9px 'Space Mono',monospace}

.side{display:flex;flex-direction:column;min-height:0;max-height:620px}
.side h3{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.side .sh{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:baseline}
.side .sh span{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-faint)}
.list{overflow:auto;flex:1 1 auto;border-top:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.row:hover{background:#f6f7f9}
.row.sel{background:#fff7e0}
.row .pos{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px 'Space Mono',monospace;color:#fff}
.row .nm{font-weight:600;font-size:13px;line-height:1.2}
.row .mt{font-size:10.5px;color:var(--ink-faint);font-family:'Archivo Narrow',sans-serif;letter-spacing:.02em}
.row .sc{text-align:right;font-weight:700;font-size:13px}
.row .sc small{display:block;font:400 9.5px 'Space Mono',monospace;color:var(--ink-faint)}
.info{border-top:1.5px solid var(--ink);padding:14px 18px 16px;flex:0 0 auto;background:#fafbfc}
.info .empty{font-size:12px;color:var(--ink-faint);font-style:italic}
.info .ttl{font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.15}
.info .sub{font-size:11px;color:var(--ink-faint);margin-bottom:10px;font-family:'Archivo Narrow',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--paper);border-radius:8px;padding:7px 9px}
.kv b{display:block;font-family:'Fraunces',serif;font-size:17px;line-height:1.1}
.kv span{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-family:'Archivo Narrow',sans-serif;font-weight:600}
.ranks{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.ranks span{font:700 10.5px 'Space Mono',monospace;padding:3px 7px;border-radius:5px;color:#fff}

.chartwrap{border-top:1px solid var(--line-soft);padding:20px 22px}
.chartwrap h3{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.chartwrap .ph{font-size:12px;color:var(--ink-faint);margin-bottom:12px}
.cv{position:relative;width:100%}

/* numbered map pins */
.pinicon{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font:700 10px 'Space Mono',monospace;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-tooltip.tt{font-family:'Archivo',sans-serif;font-size:12px;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow);padding:7px 10px}
.tt b{font-size:13px}.tt small{color:var(--ink-faint)}

/* ---------- MATRIX ---------- */
.hm-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
.hm{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
.hm th,.hm td{padding:0;text-align:center}
.hm thead th{position:sticky;top:0;z-index:2;background:var(--card);padding:14px 8px 11px;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12.5px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.hm thead th.corr{text-align:left;padding-left:20px}
.hm thead th .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.corrcell{text-align:left;padding:0 20px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);cursor:pointer}
.corrcell .cid{font-weight:600;font-size:13px}
.corrcell .cmeta{font-size:10.5px;color:var(--ink-faint);font-family:'Archivo Narrow',sans-serif}
.cell{position:relative;height:44px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;border-bottom:1px solid rgba(255,255,255,.5)}
.cell .rk{position:absolute;top:3px;right:6px;font-family:'Space Mono',monospace;font-size:8.5px;opacity:.6;font-weight:700}
.cell.tot{font-family:'Fraunces',serif;font-size:15px}
.hm tr.sel .corrcell{background:#fff7e0}

footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint);font-family:'Archivo Narrow',sans-serif;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:960px){
  .mgrid{grid-template-columns:1fr}.mapcol{border-right:none;border-bottom:1px solid var(--line-soft)}
  .mapcol{min-height:440px}.side{max-height:none}.list{max-height:360px}
  .tabs{overflow-x:auto}.tabs a{flex:0 0 auto;padding:10px 14px;font-size:13px;white-space:nowrap}
  .scount{margin-left:0;width:100%}
}
@media(max-width:560px){.wrap{padding:0 16px}.mapcol{min-height:380px}.mapnote{left:50px;right:10px}select{min-width:0}}
</style>
</head>

function listFor(k,sk=k){
  const st=ST[sk];
  let f=recs.filter(r=>st.county==='ALL'||r.county===st.county);
  f.sort((a,b)=>rank(a,k)-rank(b,k));
  return st.top10?f.slice(0,10):f;
}

// ================= BUILD PAGE =================
function toolbarHTML(k){
  return `<div class="sbar" data-sec="${k}">
    <div class="ctrl"><label>County</label><select class="county">
      <option value="ALL">All counties</option>${DATA.counties.map(c=>`<option value="${c}">${title(c)}</option>`).join('')}</select></div>
    <div class="ctrl"><label>Show</label><div class="seg"><button data-v="10" class="on">Top 10</button><button data-v="all">All corridors</button></div></div>
    <button class="reset">Reset</button>
    <span class="scount"></span>
  </div>`;
}
function sectionHTML(c,i){
  const isTot=c.k==='tot';
  return `<section id="sec-${c.k}">
   <div class="shead"><span class="snum">0${i+1}</span><h2><span class="chip" style="background:${c.color}"></span>${c.label}</h2></div>
   <p class="sdesc">${c.desc}</p>
   <div class="card"><div class="accent" style="background:${c.color}"></div>
    ${toolbarHTML(c.k)}
    <div class="mgrid">
     <div class="mapcol">
      <div class="map" id="map-${c.k}"></div>
      ${GEOM?'':'<div class="mapnote">PREVIEW — schematic lines; real corridor shapefile goes here</div>'}
      <div class="maphint">Click map to enable scroll-zoom</div>
     </div>
     <div class="side">
      <div class="sh"><h3 id="lt-${c.k}"></h3><span>Regional score</span></div>
      <div class="list" id="list-${c.k}"></div>
      <div class="info" id="info-${c.k}"></div>
     </div>
    </div>
    <div class="mlegend" id="leg-${c.k}"></div>
    <div class="chartwrap">
      <h3>${isTot?'What drives the total score':'Score composition'}</h3>
      <div class="ph">${isTot?'Each bar splits the total score into the five criteria':'Each bar splits the '+c.label+' score into its sub-measures'} &middot; corridors in current view</div>
      <div class="cv"><canvas id="ch-${c.k}"></canvas></div>
    </div>
   </div>
  </section>`;
}
function build(){
  document.getElementById('kpis').innerHTML=[[N,'Corridors ranked'],[DATA.counties.length,'Counties'],['5','Ranking criteria']]
    .map(i=>`<div class="kpi"><div class="v tnum">${i[0]}</div><div class="l">${i[1]}</div></div>`).join('');
  document.getElementById('src').textContent=SOURCE;
  const tabs=[...CATS.map(c=>[c.k,c.label,c.color]),['matrix','All Scores','#4B5563']];
  document.getElementById('jump').innerHTML=tabs.map(([k,l,col])=>`<a href="#sec-${k}" style="--c:${col}">${l}</a>`).join('');
  document.getElementById('app').innerHTML=CATS.map(sectionHTML).join('')+
   `<section id="sec-matrix"><div class="shead"><span class="snum">0${CATS.length+1}</span><h2>All scores at a glance</h2></div>
    <p class="sdesc">Every criterion side by side, ordered by total rank. Cell shade = rank class within that criterion; small number = regional rank.</p>
    <div class="card"><div class="accent" style="background:#4B5563"></div>${toolbarHTML('matrix')}<div class="hm-scroll" id="matrix"></div></div></section>`;
  // per-section filter handlers
  document.querySelectorAll('.sbar').forEach(bar=>{
    const k=bar.dataset.sec, st=ST[k], sel=bar.querySelector('.county'), btns=bar.querySelectorAll('.seg button');
    const sync=()=>{sel.value=st.county;btns.forEach(b=>b.classList.toggle('on',(b.dataset.v==='10')===st.top10));};
    sel.onchange=()=>{st.county=sel.value;renderSec(k,true);};
    btns.forEach(b=>b.onclick=()=>{st.top10=b.dataset.v==='10';sync();renderSec(k,false);});
    bar.querySelector('.reset').onclick=()=>{st.county='ALL';st.top10=true;sync();renderSec(k,true);};
  });
  CATS.forEach(initMap);
  // highlight the tab of the section in view
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id;document.querySelectorAll('#jump a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));}}),{rootMargin:'-40% 0px -55% 0px'});
  document.querySelectorAll('section').forEach(s=>io.observe(s));
}

// ================= MAPS =================
const MAPS={}; let REGION_BOUNDS=null;
const TOPO_RASTER='https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
const TOPO_VECTOR_ITEM='7dc6cea0b1764a1f9af2e679f642f0f5';   // Esri "World Topographic Map" (vector, same as ArcGIS Online / ExB)
function initMap(c){
  const m=L.map('map-'+c.k,{scrollWheelZoom:false,preferCanvas:true,zoomSnap:.25});
  // raster Topographic underneath as a fallback; the vector Topographic draws on top when it loads
  L.tileLayer(TOPO_RASTER,{maxZoom:19,attribution:'Esri, TomTom, Garmin, FAO, NOAA, USGS, EPA, NPS | Atlanta Regional Commission'}).addTo(m);
  try{ if(L.esri&&L.esri.Vector) L.esri.Vector.vectorTileLayer(TOPO_VECTOR_ITEM,{pane:'tilePane'}).addTo(m); }catch(e){console.warn('Vector basemap unavailable',e);}
  m.on('click',()=>m.scrollWheelZoom.enable()); m.on('mouseout',()=>m.scrollWheelZoom.disable());
  MAPS[c.k]={map:m,layer:L.layerGroup().addTo(m),renderer:L.canvas({padding:.5,tolerance:6})};
  if(!REGION_BOUNDS){REGION_BOUNDS=L.latLngBounds(Object.values(GEO).flat(2));}
}
function tip(r,c,pos){
  const inC=ST[c.k].county!=='ALL'&&pos?` &middot; #${pos} in county`:'';
  return `<b>${r.id}</b><br><small>${title(r.county)} &middot; ${r.fac}</small><br>${c.label}: <b>${score(r,c.k).toFixed(2)}</b> &middot; Rank #${rank(r,c.k)}${inC}`;
}
function drawMap(c,shown,fit){
  const st=ST[c.k], {map,layer,renderer}=MAPS[c.k]; layer.clearLayers();
  const pos=new Map(shown.map((r,i)=>[r.id,i+1]));
  const order=recs.slice().sort((a,b)=>rank(b,c.k)-rank(a,c.k)); // low priority first, top drawn last
  const bounds=[];
  order.forEach(r=>{
    const lines=GEO[r.id]; if(!lines) return;
    const inCounty=st.county==='ALL'||r.county===st.county;
    const on=pos.has(r.id), rk=rank(r,c.k), cl=clsOf(rk);
    let style;
    if(!inCounty) style={color:'#9aa1ad',weight:1,opacity:.4};
    else if(!on)  style={color:'#7d8592',weight:1.3,opacity:.5};
    else          style={color:st.top10?c.color:clsColor(c,rk),weight:st.top10?5:cl.w,opacity:.95};
    if(inCounty) lines.forEach(l=>bounds.push(...l));
    if(r.id===SEL) L.polyline(lines,{renderer,color:'#f2b705',weight:style.weight+7,opacity:.95,interactive:false}).addTo(layer);
    if(on&&inCounty&&(st.top10||cl.t>=.75)) L.polyline(lines,{renderer,color:'#ffffff',weight:style.weight+3,opacity:.9,interactive:false}).addTo(layer);  // white halo so lines read on the topo basemap
    const pl=L.polyline(lines,{renderer,...style}).addTo(layer);
    pl.bindTooltip(tip(r,c,pos.get(r.id)),{sticky:true,className:'tt'});
    pl.on('click',e=>{L.DomEvent.stopPropagation(e);select(r.id);});
  });
  if(st.top10) shown.forEach((r,i)=>{
    const p=midpoint(GEO[r.id]||[[[0,0]]]); const s=r.id===SEL?26:21;
    L.marker(p,{icon:L.divIcon({className:'',html:`<div class="pinicon" style="width:${s}px;height:${s}px;background:${c.color}">${i+1}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]}),zIndexOffset:1000-i})
     .bindTooltip(tip(r,c,i+1),{className:'tt',direction:'top',offset:[0,-10]}).on('click',()=>select(r.id)).addTo(layer);
  });
  if(fit){const b=st.county==='ALL'?REGION_BOUNDS:L.latLngBounds(bounds);if(b.isValid())map.fitBounds(b,{padding:[18,18]});}
}
function legendHTML(c){
  const lab=`<b style="font-family:'Archivo Narrow';letter-spacing:.05em;text-transform:uppercase;font-size:11px">`;
  if(ST[c.k].top10) return `${lab}Map</b><span class="sw"><span class="ln" style="height:5px;background:${c.color}"></span>Top 10 corridors in view</span>
     <span class="sw"><span class="pin" style="background:${c.color}">1</span>Position in top 10</span>
     <span class="sw"><span class="ln" style="height:2px;background:#7d8592"></span>Other corridors</span>`;
  return `${lab}Regional rank</b>`+CLASSES.map(cl=>`<span class="sw"><span class="ln" style="height:${Math.max(2,cl.w)}px;background:${ramp(c,cl.t)}"></span>Rank ${cl.lab}</span>`).join('')+
     (ST[c.k].county!=='ALL'?`<span class="sw"><span class="ln" style="height:2px;background:#9aa1ad"></span>Outside county</span>`:'');
}

// ================= SIDE LIST + INFO =================
function drawList(c,shown){
  const st=ST[c.k], where=st.county==='ALL'?'Region':title(st.county);
  document.getElementById('lt-'+c.k).textContent=(st.top10?'Top 10 · ':'All corridors · ')+where;
  document.getElementById('list-'+c.k).innerHTML=shown.map((r,i)=>{
    const rk=rank(r,c.k), bg=st.top10?c.color:clsColor(c,rk), dark=st.top10||clsOf(rk).t>.4;
    return `<div class="row${r.id===SEL?' sel':''}" data-id="${r.id}">
      <div class="pos" style="background:${bg};color:${dark?'#fff':'#1a1d24'}">${i+1}</div>
      <div><div class="nm">${r.id}</div><div class="mt">${title(r.county)} · ${r.fac}</div></div>
      <div class="sc tnum">${score(r,c.k).toFixed(2)}<small>Rank #${rk}</small></div></div>`;}).join('')||'<div class="row"><i>No corridors</i></div>';
  document.querySelectorAll('#list-'+c.k+' .row[data-id]').forEach(el=>el.onclick=()=>select(el.dataset.id));
  const info=document.getElementById('info-'+c.k), r=SEL&&byId[SEL];
  if(!r){info.innerHTML='<div class="empty">Click a corridor on the map or in the list to see its details.</div>';return;}
  let body;
  if(c.k==='tot'){
    body=`<div class="kv"><div><b class="tnum">${r.M.p.TTI.toFixed(2)}</b><span>Travel Time Index</span></div>
      <div><b class="tnum">${r.S.p.Crash_Rate.toFixed(2)}</b><span>Crash Rate</span></div>
      <div><b class="tnum">${r.S.p.Inj_Fat.toFixed(2)}</b><span>Injury-Fatality Rate</span></div></div>
      <div class="ranks">${CATS.map(x=>`<span style="background:${x.color}" title="${x.label}">${x.short} #${rank(r,x.k)}</span>`).join('')}</div>`;
  }else{
    body=`<div class="kv"><div><b class="tnum">${score(r,c.k).toFixed(2)}</b><span>${c.short} score</span></div>
      <div><b class="tnum">#${rank(r,c.k)}</b><span>Regional rank</span></div><div><b class="tnum">#${r.totRank}</b><span>Total rank</span></div></div>
      <div class="ranks">${c.params.map(p=>`<span style="background:#fff;color:var(--ink-soft);border:1px solid var(--line)">${p[1]} ${(+r[c.k].p[p[0]]).toFixed(2)}</span>`).join('')}</div>`;
  }
  info.innerHTML=`<div class="ttl">${r.id}</div><div class="sub">${title(r.county)} County · ${r.fac}</div>${body}`;
}
function select(id){ SEL=SEL===id?null:id; SECS.forEach(k=>renderSec(k,false)); }

// ================= CHARTS =================
const CH={};
function shades(c,n){return Array.from({length:n},(_,i)=>ramp(c,n===1?.8:.1+.9*i/(n-1)));}
function drawChart(c,shown){
  const sub=shown.slice(0,25); if(CH[c.k])CH[c.k].destroy();
  const cvs=document.getElementById('ch-'+c.k); cvs.parentElement.style.height=Math.max(200,sub.length*24+70)+'px';
  const labels=sub.map((r,i)=>`${i+1}. ${r.id}`);
  const ds=c.k==='tot'
    ? DIMS.map(d=>({label:d.label,data:sub.map(r=>r[d.k].s),backgroundColor:d.color}))
    : c.params.map((p,i)=>({label:p[1],data:sub.map(r=>+r[c.k].p[p[0]]),backgroundColor:shades(c,c.params.length)[i]}));
  ds.forEach(d=>Object.assign(d,{borderColor:'#ffffff',borderWidth:1,barPercentage:.8,categoryPercentage:.85}));
  CH[c.k]=new Chart(cvs,{type:'bar',data:{labels,datasets:ds},options:{indexAxis:'y',maintainAspectRatio:false,responsive:true,animation:{duration:250},
    onClick:(e,els)=>{if(els.length)select(sub[els[0].index].id);},
    plugins:{legend:{position:'bottom',labels:{boxWidth:11,boxHeight:11,font:{family:'Archivo',size:11},color:'#444b59'}},
      tooltip:{callbacks:{footer:x=>'Total '+x.reduce((s,v)=>s+v.parsed.x,0).toFixed(2)}}},
    scales:{x:{stacked:true,grid:{color:'#eceef2'},ticks:{font:{family:'Space Mono',size:10},color:'#5f6775'}},
      y:{stacked:true,grid:{display:false},ticks:{font:{family:'Archivo',size:11,weight:'600'},color:ctx=>sub[ctx.index]&&sub[ctx.index].id===SEL?'#b45309':'#1a1d24'}}}}});
}

// ================= MATRIX =================
function drawMatrix(){
  const rows=listFor('tot','matrix');
  const head=`<th class="corr">Corridor</th>${CATS.map(c=>`<th><span class="dot" style="background:${c.color}"></span>${c.short}</th>`).join('')}`;
  const body=rows.map(r=>`<tr class="${r.id===SEL?'sel':''}"><td class="corrcell" data-id="${r.id}"><div class="cid">${r.id}</div><div class="cmeta">${title(r.county)} · ${r.fac}</div></td>${
    CATS.map(c=>{const rk=rank(r,c.k),t=clsOf(rk).t;return `<td class="cell${c.k==='tot'?' tot':''}" style="background:${ramp(c,t)};color:${t>.4?'#fff':'#1a1d24'}"><span class="rk">#${rk}</span>${score(r,c.k).toFixed(2)}</td>`;}).join('')}</tr>`).join('');
  document.getElementById('matrix').innerHTML=`<table class="hm"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll('#matrix .corrcell').forEach(el=>el.onclick=()=>select(el.dataset.id));
}

// ================= RENDER =================
function renderSec(k,fit){
  const n=recs.filter(r=>ST[k].county==='ALL'||r.county===ST[k].county).length;
  document.querySelector(`.sbar[data-sec="${k}"] .scount`).textContent=`${ST[k].top10?Math.min(10,n):n} of ${n} corridors shown`;
  if(k==='matrix') return drawMatrix();
  const c=CATS.find(x=>x.k===k), shown=listFor(k);
  drawMap(c,shown,fit); drawList(c,shown); drawChart(c,shown);
  document.getElementById('leg-'+k).innerHTML=legendHTML(c);
}
function init(){build();SECS.forEach(k=>renderSec(k,true));}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
